name: Build & Sign Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - uses: actions/checkout@v4

    # 2. Set up Java environment
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build the Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 5. Sign the APK (Fixed)
    - name: Sign App
      id: sign_app
      uses: ilharp/sign-android-release@v1
      with:
        releaseDir: app/build/outputs/apk/release
        signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        keyAlias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        buildTools: 34.0.0  # <--- THIS IS THE FIX. IT FORCES IT TO USE THE INSTALLED VERSION.
      
    # 6. Upload the Signed APK to GitHub
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: ordrino-release-signed
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        compression-level: 0
