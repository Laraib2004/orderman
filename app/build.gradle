plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // Add this line
}

android {
    namespace 'com.example.orderman' // Replace with your package name
    compileSdk 34 // Or your target SDK version

    defaultConfig {
        applicationId "com.example.orderman" // Replace with your package name
        minSdk 26 // Or your min SDK version
        targetSdk 33 // Or your target SDK version
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.google.android.material:material:1.12.0' // Use the latest stable version

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'


    // Stripe
    implementation("com.stripe:stripeterminal:4.5.0")
    implementation "com.stripe:stripeterminal-taptopay:4.5.0"
    implementation "com.stripe:stripeterminal-core:4.5.0"


    // Firebase BoM (Bill of Materials) - ALWAYS use the BoM for consistent versions
    implementation(platform("com.google.firebase:firebase-bom:32.7.4")) // Check for latest version on Firebase website

    // Firebase Authentication
    implementation("com.google.firebase:firebase-auth")

    // Firebase Firestore
    implementation("com.google.firebase:firebase-firestore")
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    implementation 'androidx.activity:activity:1.8.0'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.firebaseui:firebase-ui-firestore:8.0.2' // Or the latest version you're using

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}