// build.gradle (Project: Orderman2)

buildscript {
    repositories {
        google()  // Keep this here for buildscript dependencies (like google-services plugin)
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.0' // Your AGP version
        classpath 'com.google.gms:google-services:4.4.2' // Your google-services plugin version
    }
}

